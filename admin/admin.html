<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Адмінка — AppleX</title>
<meta name="csrf-token" content="__CSRF_TOKEN__" />
<style nonce="__CSP_NONCE__">
  :root {
    --bg: #0a0a0b;
    --panel: #121214;
    --border: rgba(255,255,255,.08);
    --text: #f5f5f7;
    --muted: #a1a1aa;
    --accent: #ff8a1f;
    --accent-2: #ffb15a;
    --good: #43d17a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    font-size: 1.8rem;
    letter-spacing: -.04em;
    margin: 0 0 20px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab-btn {
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
    font-size: .92rem;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--accent), #ff6423);
    color: #fff;
    border-color: transparent;
  }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 1px 8px;
    font-size: .75rem;
    margin-left: 6px;
  }
  .refresh-btn {
    margin-left: auto;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-weight: 700;
  }
  .clear-btn {
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(239,68,68,.35);
    background: rgba(239,68,68,.1);
    color: #f87171;
    cursor: pointer;
    font-weight: 700;
  }
  .clear-btn:hover { background: rgba(239,68,68,.18); }
  .tab-row { display: flex; align-items: center; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  th, td {
    padding: 12px 14px;
    text-align: left;
    font-size: .9rem;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    font-size: .75rem;
    letter-spacing: .04em;
  }
  tr:last-child td { border-bottom: none; }
  tr.processed { opacity: .45; }
  .status-btn {
    padding: 6px 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: .82rem;
  }
  .status-btn.new { background: rgba(255,138,31,.15); color: var(--accent-2); }
  .status-btn.done { background: rgba(67,209,122,.15); color: var(--good); }
  .empty-msg { color: var(--muted); padding: 30px; text-align: center; }
  [hidden] { display: none !important; }
  .error-banner {
    margin: 0 0 16px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,80,80,.35);
    background: rgba(255,80,80,.1);
    color: #ffb4b4;
    font-size: .92rem;
  }
  .panel-section { display: none; }
  .panel-section.active { display: block; }
</style>
</head>
<body>

<h1>Адмінка AppleX</h1>
<div class="error-banner" id="errorBanner" role="alert" hidden></div>

<div class="tab-row">
  <div class="tabs">
    <button class="tab-btn active" data-tab="orders">Замовлення <span class="badge" id="ordersCount">0</span></button>
    <button class="tab-btn" data-tab="tradeins">Trade-In <span class="badge" id="tradeinsCount">0</span></button>
  </div>
  <button class="clear-btn" id="clearOrdersBtn" hidden>🗑 Очистити замовлення</button>
  <button class="clear-btn" id="clearTradeinsBtn" hidden>🗑 Очистити Trade-In</button>
  <button class="refresh-btn" id="refreshBtn">↻ Оновити</button>
</div>

<div class="panel-section active" id="panel-orders">
  <table>
    <thead>
      <tr>
        <th>#</th><th>Дата</th><th>Ім'я</th><th>Телефон</th><th>Модель</th><th>Ціна</th><th>Статус</th>
      </tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>
  <div class="empty-msg" id="ordersEmpty" hidden>Замовлень поки немає.</div>
</div>

<div class="panel-section" id="panel-tradeins">
  <table>
    <thead>
      <tr>
        <th>#</th><th>Дата</th><th>Ім'я</th><th>Телефон</th><th>Здає</th><th>Хоче отримати</th><th>Доплата</th><th>Статус</th>
      </tr>
    </thead>
    <tbody id="tradeinsBody"></tbody>
  </table>
  <div class="empty-msg" id="tradeinsEmpty" hidden>Заявок Trade-In поки немає.</div>
</div>

<script nonce="__CSP_NONCE__">
const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').content;

// Екранування: усе, що прийшло від клієнтів сайту, вважаємо ворожим текстом
function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Єдина обгортка для запитів до API адмінки (токен CSRF + обробка помилок)
async function api(url, method = 'GET') {
  const res = await fetch(url, {
    method,
    headers: method === 'GET' ? {} : { 'X-CSRF-Token': CSRF_TOKEN },
    cache: 'no-store',
  });
  let json = null;
  try { json = await res.json(); } catch { /* тіло не JSON (напр. 401) */ }
  if (!res.ok || !json || json.success === false) {
    const msg = (json && json.message) || ('Помилка ' + res.status);
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return json;
}

function fmtDate(iso) {
  const d = new Date(iso.replace(' ', 'T') + 'Z');
  return d.toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function loadOrders() {
  const json = await api('/api/admin/orders');
  const body = document.getElementById('ordersBody');
  const empty = document.getElementById('ordersEmpty');
  const rows = json.data || [];
  document.getElementById('ordersCount').textContent = rows.filter(r => !r.processed).length;

  if (!rows.length) {
    body.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  body.innerHTML = rows.map(r => `
    <tr class="${r.processed ? 'processed' : ''}">
      <td>${esc(r.id)}</td>
      <td>${esc(fmtDate(r.created_at))}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.phone)}</td>
      <td>${esc(r.model)}</td>
      <td>${esc(r.price)}</td>
      <td><button class="status-btn ${r.processed ? 'done' : 'new'}" data-kind="orders" data-id="${esc(r.id)}">${r.processed ? '✓ Оброблено' : 'Нова'}</button></td>
    </tr>
  `).join('');
}

async function loadTradeins() {
  const json = await api('/api/admin/tradeins');
  const body = document.getElementById('tradeinsBody');
  const empty = document.getElementById('tradeinsEmpty');
  const rows = json.data || [];
  document.getElementById('tradeinsCount').textContent = rows.filter(r => !r.processed).length;

  if (!rows.length) {
    body.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  body.innerHTML = rows.map(r => `
    <tr class="${r.processed ? 'processed' : ''}">
      <td>${esc(r.id)}</td>
      <td>${esc(fmtDate(r.created_at))}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.phone)}</td>
      <td>${esc(r.give_model)}</td>
      <td>${esc(r.get_model)}</td>
      <td>${esc(r.topup)}</td>
      <td><button class="status-btn ${r.processed ? 'done' : 'new'}" data-kind="tradeins" data-id="${esc(r.id)}">${r.processed ? '✓ Оброблено' : 'Нова'}</button></td>
    </tr>
  `).join('');
}

function reportError(err) {
  const banner = document.getElementById('errorBanner');
  let text = err.message || 'Невідома помилка';
  if (err.status === 403) text += ' (спробуй оновити сторінку — F5)';
  if (err.status === 401) text = 'Сесія завершилась — онови сторінку і увійди знову.';
  banner.textContent = text;   // textContent, не innerHTML
  banner.hidden = false;
}

async function loadAll() {
  try {
    await Promise.all([loadOrders(), loadTradeins()]);
    document.getElementById('errorBanner').hidden = true;
  } catch (err) {
    reportError(err);
  }
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.status-btn');
  if (btn) {
    const { kind, id } = btn.dataset;
    try {
      await api(`/api/admin/${kind}/${id}/toggle`, 'POST');
    } catch (err) {
      reportError(err);
    }
    loadAll();
    return;
  }

  const tab = e.target.closest('.tab-btn');
  if (tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    updateClearButtonVisibility(tab.dataset.tab);
  }
});

function updateClearButtonVisibility(activeTab) {
  document.getElementById('clearOrdersBtn').hidden = activeTab !== 'orders';
  document.getElementById('clearTradeinsBtn').hidden = activeTab !== 'tradeins';
}

async function clearAll(kind, label) {
  const typed = prompt(`Це незворотно видалить УСІ ${label} з бази.\nЩоб підтвердити, введи слово: видалити`);
  if (typed !== 'видалити') {
    if (typed !== null) alert('Скасовано — слово введено неправильно.');
    return;
  }
  try {
    await api(`/api/admin/${kind}/clear`, 'POST');
  } catch (err) {
    reportError(err);
  }
  loadAll();
}

document.getElementById('clearOrdersBtn').addEventListener('click', () => clearAll('orders', 'замовлення'));
document.getElementById('clearTradeinsBtn').addEventListener('click', () => clearAll('tradeins', 'заявки Trade-In'));

document.getElementById('refreshBtn').addEventListener('click', loadAll);

updateClearButtonVisibility('orders');
loadAll();
setInterval(loadAll, 30000); // авто-оновлення кожні 30 секунд
</script>
</body>
</html>
