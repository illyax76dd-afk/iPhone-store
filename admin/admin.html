<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Адмінка — AppleX</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: #121214;
    --border: rgba(255,255,255,.08);
    --text: #f5f5f7;
    --muted: #a1a1aa;
    --accent: #ff8a1f;
    --accent-2: #ffb15a;
    --good: #43d17a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    font-size: 1.8rem;
    letter-spacing: -.04em;
    margin: 0 0 20px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab-btn {
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
    font-size: .92rem;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--accent), #ff6423);
    color: #fff;
    border-color: transparent;
  }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 1px 8px;
    font-size: .75rem;
    margin-left: 6px;
  }
  .refresh-btn {
    margin-left: auto;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-weight: 700;
  }
  .tab-row { display: flex; align-items: center; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  th, td {
    padding: 12px 14px;
    text-align: left;
    font-size: .9rem;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    font-size: .75rem;
    letter-spacing: .04em;
  }
  tr:last-child td { border-bottom: none; }
  tr.processed { opacity: .45; }
  .status-btn {
    padding: 6px 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: .82rem;
  }
  .status-btn.new { background: rgba(255,138,31,.15); color: var(--accent-2); }
  .status-btn.done { background: rgba(67,209,122,.15); color: var(--good); }
  .empty-msg { color: var(--muted); padding: 30px; text-align: center; }
  .panel-section { display: none; }
  .panel-section.active { display: block; }
</style>
</head>
<body>

<h1>Адмінка AppleX</h1>

<div class="tab-row">
  <div class="tabs">
    <button class="tab-btn active" data-tab="orders">Замовлення <span class="badge" id="ordersCount">0</span></button>
    <button class="tab-btn" data-tab="tradeins">Trade-In <span class="badge" id="tradeinsCount">0</span></button>
  </div>
  <button class="refresh-btn" id="refreshBtn">↻ Оновити</button>
</div>

<div class="panel-section active" id="panel-orders">
  <table>
    <thead>
      <tr>
        <th>#</th><th>Дата</th><th>Ім'я</th><th>Телефон</th><th>Модель</th><th>Ціна</th><th>Статус</th>
      </tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>
  <div class="empty-msg" id="ordersEmpty" style="display:none;">Замовлень поки немає.</div>
</div>

<div class="panel-section" id="panel-tradeins">
  <table>
    <thead>
      <tr>
        <th>#</th><th>Дата</th><th>Ім'я</th><th>Телефон</th><th>Здає</th><th>Хоче отримати</th><th>Доплата</th><th>Статус</th>
      </tr>
    </thead>
    <tbody id="tradeinsBody"></tbody>
  </table>
  <div class="empty-msg" id="tradeinsEmpty" style="display:none;">Заявок Trade-In поки немає.</div>
</div>

<script>
function fmtDate(iso) {
  const d = new Date(iso.replace(' ', 'T') + 'Z');
  return d.toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function loadOrders() {
  const res = await fetch('/api/admin/orders');
  const json = await res.json();
  const body = document.getElementById('ordersBody');
  const empty = document.getElementById('ordersEmpty');
  const rows = json.data || [];
  document.getElementById('ordersCount').textContent = rows.filter(r => !r.processed).length;

  if (!rows.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = rows.map(r => `
    <tr class="${r.processed ? 'processed' : ''}">
      <td>${r.id}</td>
      <td>${fmtDate(r.created_at)}</td>
      <td>${r.name || ''}</td>
      <td>${r.phone || ''}</td>
      <td>${r.model || ''}</td>
      <td>${r.price || ''}</td>
      <td><button class="status-btn ${r.processed ? 'done' : 'new'}" data-kind="orders" data-id="${r.id}">${r.processed ? '✓ Оброблено' : 'Нова'}</button></td>
    </tr>
  `).join('');
}

async function loadTradeins() {
  const res = await fetch('/api/admin/tradeins');
  const json = await res.json();
  const body = document.getElementById('tradeinsBody');
  const empty = document.getElementById('tradeinsEmpty');
  const rows = json.data || [];
  document.getElementById('tradeinsCount').textContent = rows.filter(r => !r.processed).length;

  if (!rows.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = rows.map(r => `
    <tr class="${r.processed ? 'processed' : ''}">
      <td>${r.id}</td>
      <td>${fmtDate(r.created_at)}</td>
      <td>${r.name || ''}</td>
      <td>${r.phone || ''}</td>
      <td>${r.give_model || ''}</td>
      <td>${r.get_model || ''}</td>
      <td>${r.topup || ''}</td>
      <td><button class="status-btn ${r.processed ? 'done' : 'new'}" data-kind="tradeins" data-id="${r.id}">${r.processed ? '✓ Оброблено' : 'Нова'}</button></td>
    </tr>
  `).join('');
}

async function loadAll() {
  await Promise.all([loadOrders(), loadTradeins()]);
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.status-btn');
  if (btn) {
    const { kind, id } = btn.dataset;
    await fetch(`/api/admin/${kind}/${id}/toggle`, { method: 'POST' });
    loadAll();
    return;
  }

  const tab = e.target.closest('.tab-btn');
  if (tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  }
});

document.getElementById('refreshBtn').addEventListener('click', loadAll);

loadAll();
setInterval(loadAll, 30000); // авто-оновлення кожні 30 секунд
</script>
</body>
</html>
